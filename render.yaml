services:
  - type: web
    name: hireflow-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:deploy && npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: hireflow-db
    plan: free
    databaseName: hireflow
    user: hireflow_user
